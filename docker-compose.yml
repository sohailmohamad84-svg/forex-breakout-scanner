version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: forex_scanner_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forexpassword
      POSTGRES_DB: forex_scanner
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: forex_scanner_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:forexpassword@postgres:5432/forex_scanner
      - DEFAULT_PROVIDER=yahoo
      - DEFAULT_THRESHOLD=70.0
      - SCAN_INTERVAL_SECONDS=60
      - MAX_CONCURRENCY=4
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: forex_scanner_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
